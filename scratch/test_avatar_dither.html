<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 40px; background: #fff; font-family: sans-serif; }
.avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: pointer;
  display: block;
}
</style>
</head>
<body>
<h3>Interactive Dither Avatar Test</h3>
<canvas class="avatar" id="avatar" width="128" height="128" role="img" aria-label="Portrait of Ola"></canvas>
<div id="status" style="margin-top:20px;font-size:14px;color:#666;">Ready</div>

<script>
(function initAvatarDither() {
  const canvas = document.getElementById("avatar");
  if (!canvas || !canvas.getContext) return;

  const ctx = canvas.getContext("2d");
  const size = canvas.width; // 128

  const bayer8 = [
     0, 32,  8, 40,  2, 34, 10, 42,
    48, 16, 56, 24, 50, 18, 58, 26,
    12, 44,  4, 36, 14, 46,  6, 38,
    60, 28, 52, 20, 62, 30, 54, 22,
     3, 35, 11, 43,  1, 33,  9, 41,
    51, 19, 59, 27, 49, 17, 57, 25,
    15, 47,  7, 39, 13, 45,  5, 37,
    63, 31, 55, 23, 61, 29, 53, 21
  ];

  const BLOCK_SIZE = 2;
  const NUM_MASKS = 32;
  const masks = [];

  for (let step = 0; step <= NUM_MASKS; step++) {
    const threshold = step / NUM_MASKS;
    const mCanvas = document.createElement("canvas");
    mCanvas.width = size;
    mCanvas.height = size;
    const mCtx = mCanvas.getContext("2d");

    if (step > 0) {
      mCtx.fillStyle = "#000000";
      for (let y = 0; y < size; y += BLOCK_SIZE) {
        const by = Math.floor(y / BLOCK_SIZE) % 8;
        for (let x = 0; x < size; x += BLOCK_SIZE) {
          const bx = Math.floor(x / BLOCK_SIZE) % 8;
          const val = bayer8[by * 8 + bx] / 64;
          if (threshold >= val) {
            mCtx.fillRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
          }
        }
      }
    }
    masks.push(mCanvas);
  }

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = size;
  tempCanvas.height = size;
  const tempCtx = tempCanvas.getContext("2d");

  const img1 = new Image();
  const img2 = new Image();
  let loadedCount = 0;

  function render(progress) {
    ctx.save();
    ctx.clearRect(0, 0, size, size);

    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    ctx.clip();

    ctx.drawImage(img1, 0, 0, size, size);

    if (progress > 0) {
      const maskIdx = Math.min(NUM_MASKS, Math.max(0, Math.round(progress * NUM_MASKS)));
      tempCtx.clearRect(0, 0, size, size);
      tempCtx.drawImage(img2, 0, 0, size, size);
      tempCtx.globalCompositeOperation = "destination-in";
      tempCtx.drawImage(masks[maskIdx], 0, 0);

      ctx.drawImage(tempCanvas, 0, 0);
    }
    ctx.restore();
    document.getElementById("status").innerText = "Rendered t=" + progress.toFixed(2);
  }

  // Expose test function to window
  window.testRender = render;

  let currentProgress = 0;
  let targetProgress = 0;
  let animId = null;
  const DURATION = 320;
  let startTime = null;
  let startProgress = 0;

  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const t = Math.min(1, elapsed / DURATION);
    const ease = t * (2 - t);
    currentProgress = startProgress + (targetProgress - startProgress) * ease;
    render(currentProgress);

    if (t < 1) {
      animId = requestAnimationFrame(animate);
    } else {
      currentProgress = targetProgress;
      render(currentProgress);
      animId = null;
    }
  }

  function setTarget(target) {
    if (targetProgress === target) return;
    targetProgress = target;
    startProgress = currentProgress;
    startTime = null;
    if (!animId) {
      animId = requestAnimationFrame(animate);
    }
  }

  function onImagesReady() {
    loadedCount++;
    if (loadedCount < 2) return;
    render(0);

    canvas.addEventListener("mouseenter", () => setTarget(1));
    canvas.addEventListener("mouseleave", () => setTarget(0));
    canvas.addEventListener("touchstart", () => {
      setTarget(targetProgress === 0 ? 1 : 0);
    }, { passive: true });
    document.getElementById("status").innerText = "Images loaded and ready";
  }

  img1.onload = onImagesReady;
  img2.onload = onImagesReady;
  img1.src = "../images/Profile image.png";
  img2.src = "../images/Image (Profile).svg";
})();
</script>
</body>
</html>
