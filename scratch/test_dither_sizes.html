<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 40px; font-family: sans-serif; background: #fff; }
.row { display: flex; gap: 30px; margin-bottom: 30px; }
.card { text-align: center; }
canvas { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
</style>
</head>
<body>
<h3>Testing Dither Transition (Block Size = 2 vs 3 vs 4)</h3>
<div class="row" id="row-b2"><h4>Block 2: </h4></div>
<div class="row" id="row-b3"><h4>Block 3: </h4></div>
<div class="row" id="row-b4"><h4>Block 4: </h4></div>

<script>
const bayer8 = [
   0, 32,  8, 40,  2, 34, 10, 42,
  48, 16, 56, 24, 50, 18, 58, 26,
  12, 44,  4, 36, 14, 46,  6, 38,
  60, 28, 52, 20, 62, 30, 54, 22,
   3, 35, 11, 43,  1, 33,  9, 41,
  51, 19, 59, 27, 49, 17, 57, 25,
  15, 47,  7, 39, 13, 45,  5, 37,
  63, 31, 55, 23, 61, 29, 53, 21
];

function createMask(size, blockSize, threshold) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  for (let y = 0; y < size; y += blockSize) {
    const by = Math.floor(y / blockSize) % 8;
    for (let x = 0; x < size; x += blockSize) {
      const bx = Math.floor(x / blockSize) % 8;
      const val = bayer8[by * 8 + bx] / 64;
      if (threshold >= val) {
        ctx.fillRect(x, y, blockSize, blockSize);
      }
    }
  }
  return c;
}

const img1 = new Image();
const img2 = new Image();
let loaded = 0;
function onImages() {
  loaded++;
  if (loaded < 2) return;
  const size = 128;
  const steps = [0.0, 0.25, 0.5, 0.75, 1.0];

  [2, 3, 4].forEach(bs => {
    const row = document.getElementById('row-b' + bs);
    steps.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      // Draw img1
      ctx.drawImage(img1, 0, 0, size, size);

      if (t > 0) {
        const mask = createMask(size, bs, t);
        const temp = document.createElement('canvas');
        temp.width = size;
        temp.height = size;
        const tctx = temp.getContext('2d');
        tctx.drawImage(img2, 0, 0, size, size);
        tctx.globalCompositeOperation = 'destination-in';
        tctx.drawImage(mask, 0, 0);

        ctx.drawImage(temp, 0, 0);
      }

      card.appendChild(c);
      const lbl = document.createElement('div');
      lbl.innerText = 't=' + t;
      card.appendChild(lbl);
      row.appendChild(card);
    });
  });
}

img1.onload = onImages;
img2.onload = onImages;
img1.src = '../images/Profile image.png';
img2.src = '../images/Image (Profile).svg';
</script>
</body>
</html>
